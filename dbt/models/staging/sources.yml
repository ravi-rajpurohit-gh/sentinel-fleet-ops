version: 2

sources:
  - name: raw
    description: "Synthetic raw fleet data, written by scripts/generate_data.py"
    meta:
      external_location: "../data/raw/{name}.parquet"
    tables:
      - name: sites
      - name: towers
      - name: telemetry
        loaded_at_field: ts
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
      - name: deployments
      - name: incidents
      - name: components
      - name: inventory
